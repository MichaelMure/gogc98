version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gogc98
    main: .
    binary: gogc98
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: gogc98
    ids:
      - gogc98
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: MichaelMure
    name: gogc98
